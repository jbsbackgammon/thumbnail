name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate player master
        run: node scripts/generate-players.mjs

      - name: Validate thumbnail editor script
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          const inline = scripts.at(-1)?.[1] || '';
          if (!inline.trim()) throw new Error('Inline editor script was not found.');
          new Function(inline);
          for (const name of ['downloadJson', 'importJsonFile', 'showSaveFeedback', 'init']) {
            const pattern = new RegExp('(?:async\\s+)?function\\s+' + name + '\\s*\\(');
            if (!pattern.test(inline)) throw new Error(name + ' is required by the editor but is not defined.');
          }
          if (!inline.includes("addEventListener('click', downloadJson)")) {
            throw new Error('JSON export binding is missing.');
          }
          console.log('Thumbnail editor static validation passed.');
          NODE

      - name: Validate tournament-specific match options
        run: node scripts/check-match-rounds.cjs

      - name: Validate startup field preservation
        run: node scripts/check-startup.cjs

      - name: Validate settings and storage handling
        run: node scripts/check-reliability.cjs

      - name: Browser UI smoke test
        run: node scripts/smoke-browser.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          stable=0
          for attempt in {1..20}; do
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f per_page=100 | jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length'); then
              if [ "$count" = "1" ]; then
                stable=$((stable + 1))
                echo "Pages artifact $ARTIFACT_NAME visible ($stable/4)."
                if [ "$stable" = "4" ]; then
                  echo "Pages artifact $ARTIFACT_NAME is consistently available."
                  exit 0
                fi
              elif [ "$count" -gt 1 ]; then
                echo "::error::Multiple artifacts named $ARTIFACT_NAME"
                exit 1
              else
                stable=0
              fi
            else
              stable=0
            fi
            echo "Waiting for artifact metadata to stabilize (attempt $attempt/20)"
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_NAME did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
