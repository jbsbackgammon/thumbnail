name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate player master
        run: node scripts/generate-players.mjs

      - name: Validate thumbnail editor script
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          const inline = scripts.at(-1)?.[1] || '';
          if (!inline.trim()) throw new Error('Inline editor script was not found.');
          new Function(inline);
          for (const name of ['downloadJson', 'importJsonFile', 'showSaveFeedback', 'init']) {
            const pattern = new RegExp('(?:async\\s+)?function\\s+' + name + '\\s*\\(');
            if (!pattern.test(inline)) throw new Error(name + ' is required by the editor but is not defined.');
          }
          if (!inline.includes("addEventListener('click', downloadJson)")) {
            throw new Error('JSON export binding is missing.');
          }
          console.log('Thumbnail editor static validation passed.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
