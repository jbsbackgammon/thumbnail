<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>JBS YouTube Thumbnail Maker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #657089;
      --line: #dfe3eb;
      --panel: #ffffff;
      --bg: #f4f6f9;
      --accent: #000000;
      --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans JP", "Yu Gothic", "YuGothic", "Hiragino Sans", "Meiryo", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input, select { font: inherit; }
    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: 1200px;
      margin: 0 auto;
    }
    .controls {
      padding: 24px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { min-width: 0; margin: 0; }
    .form-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: start;
      gap: 12px;
      min-width: 0;
    }
    .event-row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .details-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #photoControls { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    #photoControls .hint { grid-column: 1 / -1; }
    @media (max-width: 700px) {
      .form-row, .event-row, .details-row, #photoControls { grid-template-columns: minmax(0, 1fr); }
      #photoControls { grid-column: 1; }
    }
    label { display: block; font-size: 12px; font-weight: 700; color: #4b556b; margin-bottom: 5px; }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid #cfd5df;
      border-radius: 9px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }
    .combo-input { position: relative; }
    .combo-input input { padding-left: 53px; appearance: none; }
    .combo-input input::-webkit-calendar-picker-indicator { display: none !important; opacity: 0; }
    .combo-input button {
      position: absolute; top: 1px; left: 1px; width: 45px; height: 38px;
      border: 0; border-right: 1px solid #cfd5df; border-radius: 8px 0 0 8px;
      background: #f7f8fa; color: var(--ink); cursor: pointer;
      font-size: 12px; font-weight: 700;
    }
    .combo-menu {
      position: absolute; z-index: 5; top: calc(100% + 2px); left: 0;
      width: 100%; max-height: 240px; overflow-y: auto;
      padding: 4px; border: 1px solid #cfd5df; border-radius: 9px;
      background: #fff; box-shadow: 0 8px 20px rgba(28,39,60,.18);
    }
    .combo-menu button {
      position: static; display: block; width: 100%; height: auto;
      min-height: 34px; padding: 6px 9px; border: 0; border-radius: 5px;
      background: #fff; text-align: left; font-size: 13px; font-weight: 400;
    }
    .combo-menu button:hover, .combo-menu button:focus { background: #f1f3f6; }
    .native-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .file-picker { display: flex; align-items: center; min-height: 40px; border: 1px solid #cfd5df; border-radius: 9px; overflow: hidden; background: #fff; }
    .file-button { display: flex; align-items: center; align-self: stretch; margin: 0; padding: 0 10px; border-right: 1px solid #cfd5df; color: var(--ink); background: #f7f8fa; cursor: pointer; white-space: nowrap; }
    .file-status { min-width: 0; padding: 0 10px; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    input[type="file"] { padding: 7px; font-size: 12px; }
    .color-value { display: flex; align-items: center; gap: 10px; }
    input[type="color"] { width: 40px; height: 40px; flex: 0 0 40px; padding: 3px; border-radius: 4px; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 0; }
    input[type="color"]::-moz-color-swatch { border: 0; border-radius: 0; }
    .color-value .color-code { width: 104px; min-height: 40px; font-size: 13px; font-variant-numeric: tabular-nums; text-transform: uppercase; }
    input[type="range"] { min-height: 28px; padding: 0; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 4px; }
    .preview-actions {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 100px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preview-download {
      width: 100px;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      color: var(--accent-ink);
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .preview-restore {
      width: 100px;
      border: 1px solid var(--saved-accent, var(--accent));
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--saved-ink, var(--accent-ink));
      background: var(--saved-accent, var(--accent));
      font-weight: 800;
      cursor: pointer;
    }
    .preview-restore:disabled { opacity: .45; cursor: default; }
    .history-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      width: min(520px, calc(100vw - 28px));
      max-height: 320px;
      overflow-y: auto;
      padding: 5px;
      border: 1px solid #cfd5df;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(28,39,60,.22);
    }
    .history-menu button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
      font-size: 13px;
    }
    .history-menu button:hover, .history-menu button:focus { background: #f1f3f6; }
    .preview-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 24px;
      gap: 12px;
    }
    .preview-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .canvas-shell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    canvas {
      display: block;
      width: min(100%, 640px);
      height: auto;
      
      background: #fff;
      box-shadow: 0 12px 40px rgba(28, 39, 60, .16);
      border-radius: 4px;
    }
    .accent-chip { display:inline-flex; align-items:center; gap:7px; }
    .accent-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .hidden { display: none !important; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .controls { grid-template-columns: minmax(0, 1fr); padding: 14px; }
      .preview-wrap { padding: 14px; }
      canvas { width: min(100%, 640px); }
      .preview-actions { top: 14px; right: 14px; }
      .preview-download { padding: 9px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="preview-wrap">
      <div class="preview-actions">
        <button class="preview-download" id="downloadBtn" type="button">PNG出力</button>
        <button class="preview-restore" id="restoreBtn" type="button" aria-controls="historyMenu" aria-expanded="false" disabled>呼出</button>
        <div class="history-menu hidden" id="historyMenu"></div>
      </div>
      <div class="canvas-shell">
        <canvas id="canvas" width="1920" height="1080" aria-label="サムネイルプレビュー"></canvas>
      </div>
    </main>

    <aside class="controls">
      <section class="form-row event-row">
        <div class="field">
          <label for="edition">回次等</label>
          <input id="edition" type="text" value="" />
        </div>
        <div class="field">
          <label for="series">大会名</label>
          <div class="combo-input">
            <input id="series" value="" placeholder="未入力" />
            <button type="button" data-picker="series" aria-label="大会名の候補を表示">選択</button>
            <div class="combo-menu hidden" id="seriesMenu"></div>
          </div>
          <datalist id="seriesList"></datalist>
        </div>
        <div class="field">
          <label for="seriesSubtitle">大会名（小）</label>
          <input id="seriesSubtitle" type="text" value="" />
        </div>
        <div class="field">
          <label for="stage">試合名</label>
          <div class="combo-input">
            <input id="stage" value="" placeholder="未入力" />
            <button type="button" data-picker="stage" aria-label="試合名の候補を表示">選択</button>
            <div class="combo-menu hidden" id="stageMenu"></div>
          </div>
          <datalist id="stageList">
            <option value="決勝"></option>
            <option value="準決勝"></option>
            <option value="準々決勝"></option>
            <option value="１回戦"></option>
            <option value="２回戦"></option>
            <option value="３回戦"></option>
            <option value="本戦１回戦"></option>
            <option value="本戦２回戦"></option>
            <option value="本戦３回戦"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="stagePrefix">試合名（小）</label>
          <input id="stagePrefix" type="text" value="" />
        </div>
      </section>

<div class="form-row">
          <div class="field">
            <label for="leftPlayer">左選手マスタ</label>
            <select id="leftPlayer"></select>
          </div>
          <div class="field">
            <label for="leftPhotoOverride">写真変更</label>
            <input class="native-file" id="leftPhotoOverride" type="file" accept="image/*" />
            <div class="file-picker"><label class="file-button" for="leftPhotoOverride">選択</label><span class="file-status" id="leftPhotoStatus"></span></div>
          </div>
          <div class="field">
            <label for="leftName">日本語名</label>
            <input id="leftName" />
          </div>
          <div class="field">
            <label for="leftRoman">ローマ字</label>
            <input id="leftRoman" />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="rightPlayer">右選手マスタ</label>
            <select id="rightPlayer"></select>
          </div>
          <div class="field">
            <label for="rightPhotoOverride">写真変更</label>
            <input class="native-file" id="rightPhotoOverride" type="file" accept="image/*" />
            <div class="file-picker"><label class="file-button" for="rightPhotoOverride">選択</label><span class="file-status" id="rightPhotoStatus"></span></div>
          </div>
          <div class="field">
            <label for="rightName">日本語名</label>
            <input id="rightName" />
          </div>
          <div class="field">
            <label for="rightRoman">ローマ字</label>
            <input id="rightRoman" />
          </div>
        </div>

      <section class="form-row details-row">
        <div class="field">
          <label for="sponsor">冠名</label>
          <input id="sponsor" type="text" value="" />
        </div>
        <div class="field">
          <label for="supplement">試合補足</label>
          <input id="supplement" value="" />
        </div>
      </section>


      <section class="form-row">
        <div class="field">
          <label for="bgMode">背景写真</label>
          <select id="bgMode">
            <option value="none">なし</option>
            <option value="photoPlayers">あり（顔写真表示）</option>
            <option value="photo">あり（顔写真非表示）</option>
          </select>
        </div>
        <div id="photoControls" class="hidden">
          <div class="field">
            <label for="bgPhoto">写真</label>
            <input class="native-file" id="bgPhoto" type="file" accept="image/*" />
            <div class="file-picker"><label class="file-button" for="bgPhoto">選択</label><span class="file-status" id="bgPhotoStatus"></span></div>
          </div>
          <div class="row">
            <div class="field">
              <label for="bgX">左右位置</label>
              <input id="bgX" type="range" min="0" max="100" value="50" />
            </div>
            <div class="field">
              <label for="bgY">上下位置</label>
              <input id="bgY" type="range" min="0" max="100" value="50" />
            </div>
          </div>
          <div class="field">
            <label for="bgScale">縮小・拡大</label>
            <input id="bgScale" type="range" min="50" max="200" value="100" />
          </div>
          <div class="field">
            <label for="bgShade">暗さ</label>
            <input id="bgShade" type="range" min="0" max="70" value="0" />
          </div>
        </div>
      </section>
      <section class="form-row">
        <div class="field">
          <label for="mainColor">メインカラー</label>
          <div class="color-value">
            <input id="mainColor" type="color" value="#000000" />
            <input class="color-code" id="mainColorCode" type="text" value="#000000" aria-label="メインカラーのカラーコード" spellcheck="false" maxlength="7" />
          </div>
        </div>
        <div class="field">
          <label for="subColor">サブカラー</label>
          <div class="color-value">
            <input id="subColor" type="color" value="#525252" />
            <input class="color-code" id="subColorCode" type="text" value="#525252" aria-label="サブカラーのカラーコード" spellcheck="false" maxlength="7" />
          </div>
        </div>
      </section>
    </aside>
  </div>

  <script src="players.js?v=108"></script>
  <script>
    (() => {
      'use strict';

      const APP_BUILD = '108';
      console.info(`[JBS Thumbnail] build ${APP_BUILD}`);

      const SERIES = {
        '日本選手権': '#3C3C3C',
        '盤聖戦': '#6B0D2F',
        '名人戦': '#6B670D',
        '王位戦': '#0D6B2F',
        '賽王戦': '#0D236B',
        '棋聖戦': '#6B230D',
        '女王戦': '#6B0D5B',
        '新鋭戦': '#0D676B'
      };
      const OPEN_SERIES = {
        '大阪オープン': '#F8B62B',
        '東京オープン': '#009F40',
        '名古屋オープン': '#0C284D'
      };

      let players = Array.isArray(window.JBS_PLAYERS) ? [...window.JBS_PLAYERS] : [];
      const $ = (id) => document.getElementById(id);
      const canvas = $('canvas');
      const ctx = canvas.getContext('2d');
      const FONT_JP = '"Noto Sans JP", "Yu Gothic", "YuGothic", "Hiragino Sans", "Meiryo", sans-serif';
      const FONT_LATIN = FONT_JP;

      const state = {
        leftImage: null,
        rightImage: null,
        bgImage: null,
        leftOverride: false,
        rightOverride: false
      };
      const SAVED_FIELDS = ['edition','series','seriesSubtitle','stage','stagePrefix','leftPlayer','leftName','leftRoman','rightPlayer','rightName','rightRoman','sponsor','supplement','bgMode','bgX','bgY','bgScale','bgShade','mainColor','subColor'];
      const savedFiles = { left: null, right: null, bg: null };
      function openSavedDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('jbs-thumbnail-settings', 1);
          request.onupgradeneeded = () => request.result.createObjectStore('snapshots');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      async function savedSnapshot(mode, value, key = 'last') {
        const db = await openSavedDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('snapshots', mode === 'save' ? 'readwrite' : 'readonly');
          const request = mode === 'save' ? tx.objectStore('snapshots').put(value, key) : tx.objectStore('snapshots').get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
          tx.oncomplete = () => db.close();
          tx.onerror = () => db.close();
        });
      }
      async function loadHistory() {
        const history = await savedSnapshot('load', undefined, 'history');
        if (Array.isArray(history)) return history;
        const previous = await savedSnapshot('load');
        return previous?.fields ? [previous] : [];
      }
      function filenameFor(fields) {
        const series = [fields.series?.trim(), fields.seriesSubtitle?.trim()].filter(Boolean).join('');
        const stage = [fields.stagePrefix?.trim(), fields.stage?.trim()].filter(Boolean).join('') || 'match';
        const left = (fields.leftName || '').trim().replace(/\s+/g, '');
        const right = (fields.rightName || '').trim().replace(/\s+/g, '');
        const matchup = left || right ? `${left}vs${right}` : '';
        const edition = (fields.edition || '').trim();
        return `thumbnail_${[edition, series, stage, matchup].filter(Boolean).join('_')}.png`;
      }
      function closeHistoryMenu() {
        $('historyMenu').classList.add('hidden');
        $('restoreBtn').setAttribute('aria-expanded', 'false');
      }
      function refreshHistoryMenu(history) {
        const button = $('restoreBtn');
        const latestColor = history[0]?.fields?.mainColor || '#000000';
        button.disabled = history.length === 0;
        button.style.setProperty('--saved-accent', latestColor);
        button.style.setProperty('--saved-ink', contrastText(latestColor));
        const menu = $('historyMenu');
        menu.replaceChildren();
        history.slice(0, 100).forEach((snapshot, index) => {
          if (!snapshot?.fields) return;
          const item = document.createElement('button');
          item.type = 'button';
          item.textContent = snapshot.filename || filenameFor(snapshot.fields);
          item.title = item.textContent;
          item.addEventListener('click', () => {
            closeHistoryMenu();
            restoreHistory(index).catch(error => console.error('保存した設定を読み込めませんでした。', error));
          });
          menu.appendChild(item);
        });
        if (button.disabled) closeHistoryMenu();
      }
      async function saveCurrentSettings(filename) {
        const fields = Object.fromEntries(SAVED_FIELDS.map(id => [id, $(id).value]));
        const history = [{ filename, fields, files: { ...savedFiles }, savedAt: Date.now() }, ...await loadHistory()].slice(0, 100);
        await savedSnapshot('save', history, 'history');
        refreshHistoryMenu(history);
      }
      async function restoreHistory(index) {
        const snapshot = (await loadHistory())[index];
        if (!snapshot?.fields) return;
        for (const id of SAVED_FIELDS) {
          if (typeof snapshot.fields[id] === 'string') $(id).value = snapshot.fields[id];
        }
        lastSeries = $('series').value;
        for (const side of ['left', 'right']) {
          const player = players.find(p => p.id === $(`${side}Player`).value);
          savedFiles[side] = snapshot.files?.[side] || null;
          state[`${side}Override`] = !!savedFiles[side];
          const src = savedFiles[side] ? URL.createObjectURL(savedFiles[side]) : player?.photo;
          try { state[`${side}Image`] = src ? await loadImage(src) : null; }
          catch { state[`${side}Image`] = null; }
          if (savedFiles[side]) URL.revokeObjectURL(src);
          $(`${side}PhotoStatus`).textContent = savedFiles[side]?.name || '';
        }
        savedFiles.bg = snapshot.files?.bg || null;
        const bgSrc = savedFiles.bg && URL.createObjectURL(savedFiles.bg);
        try { state.bgImage = bgSrc ? await loadImage(bgSrc) : null; }
        catch { state.bgImage = null; }
        if (bgSrc) URL.revokeObjectURL(bgSrc);
        $('bgPhotoStatus').textContent = savedFiles.bg?.name || '';
        render();
      }

      function hexToRgb(hex) {
        const v = hex.replace('#', '');
        return {
          r: parseInt(v.slice(0,2), 16),
          g: parseInt(v.slice(2,4), 16),
          b: parseInt(v.slice(4,6), 16)
        };
      }
      function alpha(hex, a) {
        const {r,g,b} = hexToRgb(hex);
        return `rgba(${r},${g},${b},${a})`;
      }
      function luminance(r, g, b) {
        const channel = value => {
          const c = value / 255;
          return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
      }
      function contrastText(hex) {
        const {r, g, b} = hexToRgb(hex);
        return luminance(r, g, b) > 0.179 ? '#000000' : '#ffffff';
      }
      function mix(hex, amount = 0.2) {
        const {r,g,b} = hexToRgb(hex);
        const t = amount >= 0 ? 255 : 0;
        const p = Math.abs(amount);
        const c = (x) => Math.round(x + (t - x) * p);
        const toHex = (x) => c(x).toString(16).padStart(2, '0');
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }
      function syncSubColor() {
        $('subColor').value = mix($('mainColor').value, 0.32);
      }
      function normalizeHex(value) {
        const hex = value.trim().replace(/^#/, '');
        if (/^[0-9a-f]{3}$/i.test(hex)) return `#${[...hex].map(c => c + c).join('').toUpperCase()}`;
        if (/^[0-9a-f]{6}$/i.test(hex)) return `#${hex.toUpperCase()}`;
        return null;
      }
      let lastSeries = null;
      function applySeriesColors() {
        const series = $('series').value;
        if (series !== lastSeries) {
          lastSeries = series;
          if (Object.prototype.hasOwnProperty.call(SERIES, series)) {
            $('mainColor').value = SERIES[series];
            syncSubColor();
          }
        }
        render();
      }
      function roundedRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }
      function drawCover(img, x, y, w, h, posX = 50, posY = 50) {
        if (!img || !img.naturalWidth) return;
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const scale = Math.max(w / iw, h / ih);

      function drawScaledBackground(img, x, y, w, h, posX = 50, posY = 50, zoom = 100) {

        const scale = baseScale * (zoom / 100);
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        const dx = x + (w - dw) * (posX / 100);
        const dy = y + (h - dh) * (posY / 100);

        ctx.rect(x, y, w, h);

      function fitText(text, maxWidth, startSize, minSize, family = FONT_JP, weight = 800) {

      function drawTextFit(text, x, y, maxWidth, startSize, minSize, color, align = 'center', family = FONT_JP, weight = 800) {

      function drawImpactTextFit(text, x, y, maxWidth, startSize, minSize, fill, stroke, shadowColor, shadowBlur, shadowY, align = 'center', family = FONT_JP, weight = 900, strokeWidth = 0, alignTop = false) {
        const size = fitText(text, maxWidth, startSize, minSize, family, weight);

        ctx.textAlign = align;

      function drawImpactTextCondensed(text, x, y, maxWidth, size, fill, stroke, shadowColor, shadowBlur, shadowY, family = FONT_JP, weight = 900, strokeWidth = 0) {
        ctx.save();
        ctx.font = `${weight} ${size}px ${family}`;
        const scaleX = Math.min(1, maxWidth / Math.max(1, ctx.measureText(text).width + strokeWidth * 2));
        ctx.translate(x, y);
        ctx.scale(scaleX, 1);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const isBlackText = fill.toLowerCase() === '#000000';
        ctx.shadowColor = isBlackText ? 'rgba(255,255,255,0.4)' : shadowColor;
        ctx.shadowBlur = isBlackText ? Math.min(shadowBlur, 12) : shadowBlur;
        ctx.shadowOffsetY = isBlackText ? 0 : (shadowY || 0);
        if (strokeWidth > 0) {

          ctx.miterLimit = 2;
          ctx.lineWidth = strokeWidth;

      function drawBackgroundPattern(accent) {
        const grad = ctx.createLinearGradient(0, 0, 1920, 1080);
        grad.addColorStop(0, mix(accent, -0.18));
        grad.addColorStop(0.55, accent);
        grad.addColorStop(1, mix(accent, -0.06));
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1920, 1080);

        ctx.save();
        ctx.globalAlpha = 0.42;
        const pointTop = -40;
        const pointBottom = 362;
        const gap = 7;
        const sideMargin = 36;
        const centerGap = 80;
        const groupWidth = (1920 - sideMargin * 2 - centerGap) / 2;
        const pointW = (groupWidth - gap * 5) / 6;
        ctx.fillStyle = $('subColor').value;
        for (const groupX of [sideMargin, 960 + centerGap / 2]) {
          for (let i = 0; i < 6; i++) {
            const x = groupX + i * (pointW + gap);
            for (const isBottom of [false, true]) {
              const baseY = isBottom ? 1080 - pointTop : pointTop;
              const tipY = isBottom ? 1080 - pointBottom : pointBottom;
              ctx.beginPath();
              ctx.moveTo(x, baseY);
              ctx.lineTo(x + pointW, baseY);

      function drawPortraitFrame(img, x, y, size, accent, side = 'left') {
        const pad = 10;

        ctx.fillStyle = alpha('#000000', 0.18);

        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#fff';
        roundedRect(x - 10, y - 10, size + 20, size + 20, 8);
        ctx.fill();
        ctx.fillStyle = accent;
        roundedRect(x - pad, y - pad, size + pad * 2, size + pad * 2, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';

        ctx.fill();

          drawCover(img, x, y, size, size, 50, 50);
          ctx.restore();
        } else {
          ctx.fillStyle = '#e8ebef';
          roundedRect(x, y, size, size, 12);

          ctx.quadraticCurveTo(x + size * 0.83, y + size * 0.74, x + size * 0.83, y + size * 0.9);
          ctx.lineTo(x + size * 0.83, y + size);

          ctx.fill();
          ctx.restore();

      }
      function drawCenterTitle(accent, isPhotoMode, titleColor) {
        const series = $('series').value;

      function drawNameBands(accent, isPhotoMode, backgroundInk) {

      function render() {
        const series = $('series').value;
        const accent = $('mainColor').value;
        if (document.activeElement !== $('mainColorCode')) $('mainColorCode').value = accent.toUpperCase();
        if (document.activeElement !== $('subColorCode')) $('subColorCode').value = $('subColor').value.toUpperCase();

        const hasBackgroundPhoto = bgMode !== 'none';
        const showPlayerPhotos = bgMode !== 'photo';

        document.documentElement.style.setProperty('--accent-ink', contrastText(accent));

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }
      async function applyPlayer(side, playerId, forcePhoto = true) {
        const p = players.find(x => x.id === playerId);
        if (!p) {
          $(`${side}Name`).value = '';
          $(`${side}Roman`).value = '';
          state[`${side}Image`] = null;
          state[`${side}Override`] = false;
          savedFiles[side] = null;
          render();
          return;
        }
        $(`${side}Name`).value = p.name || '';
        $(`${side}Roman`).value = p.roman || '';

          try {
            const img = await loadImage(p.photo);
            state[`${side}Image`] = img;
            state[`${side}Override`] = false;
            savedFiles[side] = null;
          } catch (e) {
            state[`${side}Image`] = null;

        render();
      }

      }
      async function loadGeneratedPlayers() {

          if (!Array.isArray(generated)) return;
          const existing = new Set(players.map((player) => `${player.name}\u0000${player.roman}`));
          players.push(...generated.filter((player) => !existing.has(`${player.name}\u0000${player.roman}`)));

          console.warn('[JBS Thumbnail] players.json could not be loaded.', error);

        });
        $('rightPhotoOverride').addEventListener('change', (e) => {
          $('rightPhotoStatus').textContent = e.target.files[0]?.name || '';
          loadFileImage(e.target.files[0], img => { state.rightImage = img; state.rightOverride = true; savedFiles.right = e.target.files[0]; });
        });
        $('bgPhoto').addEventListener('change', (e) => {
          $('bgPhotoStatus').textContent = e.target.files[0]?.name || '';
          loadFileImage(e.target.files[0], img => { state.bgImage = img; savedFiles.bg = e.target.files[0]; });
        });
        $('restoreBtn').addEventListener('click', () => {
          const menu = $('historyMenu');
          menu.classList.toggle('hidden');
          $('restoreBtn').setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
        });
        document.addEventListener('click', event => {
          if (!event.target.closest('.preview-actions')) closeHistoryMenu();
        });
        document.addEventListener('keydown', event => {
          if (event.key === 'Escape') closeHistoryMenu();
        });

        $('downloadBtn').addEventListener('click', async () => {
          render();
          const fields = Object.fromEntries(SAVED_FIELDS.map(id => [id, $(id).value]));
          const filename = filenameFor(fields);
          try { await saveCurrentSettings(filename); }
          catch (error) { console.warn('前回の設定を保存できませんでした。', error); }
          canvas.toBlob((blob) => {
            if (!blob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          }, 'image/png');
        });
      }

      async function init() {
        await loadGeneratedPlayers();
        populate();
        bind();
        try {
          refreshHistoryMenu(await loadHistory());
        }
        catch (error) { console.warn('保存済み設定を確認できませんでした。', error); }
        applySeriesColors();
        await Promise.all([
          applyPlayer('left', $('leftPlayer').value, true),
          applyPlayer('right', $('rightPlayer').value, true)
        ]);
        render();
      }
      init();
    })();
  </script>
</body>
</html>
