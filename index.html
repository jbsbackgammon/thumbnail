<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>YouTubeサムネイル作成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://jbsbackgammon.github.io/common/ui.css?v=55" />
</head>
<body class="jbsui jbsui-tool-page jbsui-tool-page--fit-first-view">
    <aside class="jbsui-panel">
      <div class="jbsui-actions">
        <button class="jbsui-button jbsui-button--primary jbsui-button--primary-action" id="downloadBtn" type="button">PNG出力</button>
        <span class="jbsui-divider" aria-hidden="true"></span>
        <button class="jbsui-button" id="loadSettings" type="button">設定呼出</button>
        <button class="jbsui-button" id="importJson" type="button">JSON取込</button>
        <input id="importJsonFile" type="file" accept="application/json,.json" hidden />
        <span class="jbsui-divider" aria-hidden="true"></span>
        <button class="jbsui-button" id="saveSettings" type="button">設定保存</button>
        <button class="jbsui-button" id="exportJson" type="button">JSON出力</button>
      </div>
      <section class="jbsui-grid jbsui-grid--5">
        <div class="jbsui-field">
          <label for="sponsor">ヘッダー</label>
          <input id="sponsor" type="text" value="" />
        </div>
        <div class="jbsui-field">
          <label for="edition">回次等</label>
          <input id="edition" type="text" value="" />
        </div>
        <div class="jbsui-field">
          <label for="series">大会名</label>
          <div class="jbsui-preset-input">
            <select id="seriesPreset" aria-label="大会名のプリセット"><option value="">選択</option></select>
            <input id="series" value="日本選手権" />
          </div>
        </div>
        <div class="jbsui-field">
          <label for="stage">試合名</label>
          <div class="jbsui-preset-input jbsui-preset-input--detail">
            <select id="stagePreset" aria-label="試合名のプリセット">
              <option value="">選択</option>
              <option>決勝</option>
              <option>準決勝</option>
              <option>準々決勝</option>
              <option>３回戦</option>
              <option>２回戦</option>
              <option>１回戦</option>
              <option>プレーオフ</option>
              <option>本戦３回戦</option>
              <option>本戦２回戦</option>
              <option>本戦１回戦</option>
            </select>
            <input id="stage" value="決勝" />
            <input id="stagePrefix" type="text" value="" aria-label="試合名補助" placeholder="補足" />
          </div>
        </div>
        <div class="jbsui-field">
          <label for="supplement">フッター</label>
          <input id="supplement" value="" />
        </div>
      </section>

      <div class="jbsui-player-fields">
        <div class="jbsui-field jbsui-player-field">
          <label for="leftName">左選手</label>
          <div class="jbsui-player-entry-row">
            <button type="button" class="jbsui-player-photo-picker" id="leftPhotoButton" aria-label="左選手の写真を変更" title="クリックして写真を変更">
              <img class="jbsui-player-photo-preview" id="leftPhotoPreview" src="https://jbsbackgammon.github.io/overlay/assets/dummy.png" alt="">
            </button>
            <div class="jbsui-preset-input">
              <select id="leftPlayer" aria-label="左選手名の選択"><option value="">選択</option></select>
              <input id="leftName" />
            </div>
            <input class="jbsui-file-input" id="leftPhotoOverride" type="file" accept="image/*" aria-label="左選手の写真ファイル" />
          </div>
          <input class="jbsui-player-english-input" id="leftRoman" aria-label="左選手名（英語）" placeholder="English" />
        </div>
        <div class="jbsui-field jbsui-player-field">
          <label for="rightName">右選手</label>
          <div class="jbsui-player-entry-row">
            <button type="button" class="jbsui-player-photo-picker" id="rightPhotoButton" aria-label="右選手の写真を変更" title="クリックして写真を変更">
              <img class="jbsui-player-photo-preview" id="rightPhotoPreview" src="https://jbsbackgammon.github.io/overlay/assets/dummy.png" alt="">
            </button>
            <div class="jbsui-preset-input">
              <select id="rightPlayer" aria-label="右選手名の選択"><option value="">選択</option></select>
              <input id="rightName" />
            </div>
            <input class="jbsui-file-input" id="rightPhotoOverride" type="file" accept="image/*" aria-label="右選手の写真ファイル" />
          </div>
          <input class="jbsui-player-english-input" id="rightRoman" aria-label="右選手名（英語）" placeholder="English" />
        </div>
      </div>

      <section class="jbsui-grid jbsui-grid--3">
        <div class="jbsui-field">
          <label for="bgMode">背景写真</label>
          <select id="bgMode">
            <option value="none">なし</option>
            <option value="photoPlayers">あり（顔写真表示）</option>
            <option value="photo">あり（顔写真非表示）</option>
          </select>
        </div>
        <div class="jbsui-field">
          <label for="mainColor">テーマカラー</label>
          <div class="jbsui-color-control">
            <input id="mainColor" type="color" value="#000000" />
            <input class="jbsui-hex-input" id="mainColorCode" type="text" value="#000000" aria-label="テーマカラーのカラーコード" spellcheck="false" maxlength="7" />
          </div>
        </div>
        <div class="jbsui-field">
          <label for="subColor">サブカラー</label>
          <div class="jbsui-color-control">
            <input id="subColor" type="color" value="#525252" />
            <input class="jbsui-hex-input" id="subColorCode" type="text" value="#525252" aria-label="サブカラーのカラーコード" spellcheck="false" maxlength="7" />
          </div>
        </div>
      </section>
      <div id="photoControls" class="jbsui-grid jbsui-grid--4 hidden">
          <div class="jbsui-field">
            <label for="bgPhoto">写真</label>
            <input class="jbsui-file-input" id="bgPhoto" type="file" accept="image/*" />
            <div class="jbsui-file-picker"><label class="jbsui-file-button" for="bgPhoto">選択</label><span class="jbsui-file-status" id="bgPhotoStatus"></span></div>
          </div>
          <div class="jbsui-grid jbsui-grid--2">
            <div class="jbsui-field">
              <label for="bgX">左右位置</label>
              <input id="bgX" type="range" min="0" max="100" value="50" />
            </div>
            <div class="jbsui-field">
              <label for="bgY">上下位置</label>
              <input id="bgY" type="range" min="0" max="100" value="50" />
            </div>
          </div>
          <div class="jbsui-field">
            <label for="bgScale">縮小・拡大</label>
            <input id="bgScale" type="range" min="50" max="200" value="100" />
          </div>
          <div class="jbsui-field">
            <label for="bgShade">暗さ</label>
            <input id="bgShade" type="range" min="0" max="70" value="0" />
          </div>
      </div>
    </aside>

    <main class="jbsui-preview">
      <div class="jbsui-preview-shell">
        <canvas class="jbsui-canvas-preview" id="canvas" width="1920" height="1080" aria-label="サムネイルプレビュー"></canvas>
      </div>
    </main>

    <dialog class="jbsui-dialog jbsui-settings-dialog" id="settingsDialog" aria-labelledby="settingsDialogTitle">
      <div class="jbsui-dialog-head">
        <h2 id="settingsDialogTitle">保存した設定</h2>
        <button type="button" id="closeSettings" class="jbsui-dialog-close" aria-label="閉じる">×</button>
      </div>
      <div class="jbsui-saved-settings" id="savedSettings"></div>
    </dialog>
  <script src="https://jbsbackgammon.github.io/common/brand.js"></script>
  <script src="https://jbsbackgammon.github.io/common/naming.js?v=1"></script>
  <script src="https://jbsbackgammon.github.io/common/ui.js?v=1"></script>
  <script>
    (() => {
      'use strict';

      document.addEventListener('keydown', event => {
        if (event.key === 'Tab') {
          document.documentElement.setAttribute('data-jbsui-keyboard-focus', '');
        }
      });
      document.addEventListener('pointerdown', () => {
        document.documentElement.removeAttribute('data-jbsui-keyboard-focus');
      });

      const APP_BUILD = '147';
      console.info(`[JBS Thumbnail] build ${APP_BUILD}`);

      // common が取得できない場合だけ使う従来マスタ。
      // 通常時の正本は https://jbsbackgammon.github.io/common/data/brand.json 。
      const FALLBACK_TOURNAMENTS = [
        ['japan-championship', '日本選手権', 'title', '#3C3C3C'],
        ['bansei', '盤聖戦', 'title', '#6B0D2F'],
        ['meijin', '名人戦', 'title', '#6B670D'],
        ['oui', '王位戦', 'title', '#0D6B2F'],
        ['saiou', '賽王戦', 'title', '#0D236B'],
        ['kisei', '棋聖戦', 'exchange', '#6B230D'],
        ['queen', '女王戦', 'exchange', '#6B0D5B'],
        ['shin-ei', '新鋭戦', 'exchange', '#0D676B'],
        ['osaka-open', '大阪オープン', 'open', '#F8B62B'],
        ['tokyo-open', '東京オープン', 'open', '#009F40'],
        ['nagoya-open', '名古屋オープン', 'open', '#0C284D']
      ].map(([id, name, category, color], index) => ({
        id, name, nameEn: '', category, color, subColor: null, order: index + 1, edition: ''
      }));
      let tournaments = FALLBACK_TOURNAMENTS.map(entry => ({ ...entry }));
      let commonBrandReady = false;
      const STAGE_ENGLISH = Object.freeze({
        '決勝': 'FINAL',
        '準決勝': 'SEMIFINAL',
        '準々決勝': 'QUARTERFINAL',
        '１回戦': 'ROUND 1',
        '２回戦': 'ROUND 2',
        '３回戦': 'ROUND 3',
        '本戦１回戦': 'MAIN DRAW ROUND 1',
        '本戦２回戦': 'MAIN DRAW ROUND 2',
        '本戦３回戦': 'MAIN DRAW ROUND 3'
      });
      let lastAutoSupplement = '';

      let players = [];
      const MEMBER_BASE_URL = 'https://jbsbackgammon.github.io/member/';
      const MEMBER_DATA_URL = `${MEMBER_BASE_URL}data/members.json`;
      let memberCacheKey = Date.now();
      const PLAYER_DUMMY_URL = 'https://jbsbackgammon.github.io/overlay/assets/dummy.png';
      const $ = (id) => document.getElementById(id);
      const canvas = $('canvas');
      const ctx = canvas.getContext('2d');
      const FONT_JP = '"Noto Sans JP", "Yu Gothic", "YuGothic", "Hiragino Sans", "Meiryo", sans-serif';
      const FONT_LATIN = FONT_JP;
      const CANVAS_FONT_SAMPLE = '日本選手権盤聖王名賽棋女新鋭東京大阪名古屋決勝準選手柳';
      async function ensureCanvasFonts() {
        if (!document.fonts?.load) return;
        const loads = [
          document.fonts.load("800 64px 'Noto Sans JP'", CANVAS_FONT_SAMPLE),
          document.fonts.load("900 96px 'Noto Sans JP'", CANVAS_FONT_SAMPLE)
        ];
        await Promise.allSettled(loads);
        try { await document.fonts.ready; }
        catch (_) {}
      }

      const state = {
        leftImage: null,
        rightImage: null,
        bgImage: null,
        leftOverride: false,
        rightOverride: false
      };
      const SAVED_FIELDS = ['edition','series','stage','stagePrefix','leftPlayer','leftName','leftRoman','rightPlayer','rightName','rightRoman','sponsor','supplement','bgMode','bgX','bgY','bgScale','bgShade','mainColor','subColor'];
      const savedFiles = { left: null, right: null, bg: null };
      const SETTINGS_HISTORY_KEY = 'jbs-thumbnail-settings-history';
      function openSavedDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('jbs-thumbnail-settings', 1);
          request.onupgradeneeded = () => request.result.createObjectStore('snapshots');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      async function savedSnapshot(mode, value, key = 'last') {
        const db = await openSavedDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('snapshots', mode === 'save' ? 'readwrite' : 'readonly');
          const request = mode === 'save' ? tx.objectStore('snapshots').put(value, key) : tx.objectStore('snapshots').get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
          tx.oncomplete = () => db.close();
          tx.onerror = () => db.close();
        });
      }
      async function loadHistory() {
        try {
          const history = await savedSnapshot('load', undefined, 'history');
          if (Array.isArray(history)) return history;
          const previous = await savedSnapshot('load');
          if (previous?.fields) return [previous];
        } catch (error) {
          console.warn('IndexedDBから保存設定を読み込めませんでした。localStorageを使用します。', error);
        }
        try {
          const history = JSON.parse(localStorage.getItem(SETTINGS_HISTORY_KEY) || '[]');
          return Array.isArray(history) ? history : [];
        } catch {
          return [];
        }
      }
      function filenameFor(fields) {
        const series = [fields.series?.trim(), fields.seriesSubtitle?.trim()].filter(Boolean).join('');
        const stage = [fields.stagePrefix?.trim(), fields.stage?.trim()].filter(Boolean).join('') || 'match';
        const left = (fields.leftName || '').trim().replace(/\s+/g, '');
        const right = (fields.rightName || '').trim().replace(/\s+/g, '');
        const matchup = left || right ? `${left}vs${right}` : '';
        const edition = (fields.edition || '').trim();
        return `thumbnail_${[edition, series, stage, matchup].filter(Boolean).join('_')}.png`;
      }
      function settingsNamingDetails(fields = {}) {
        return {
          edition: fields.edition || '',
          title: fields.series || '',
          round: [fields.stagePrefix, fields.stage].filter(Boolean).join(''),
          topName: fields.leftName || '',
          bottomName: fields.rightName || ''
        };
      }
      async function renderSavedSettings() {
        const container = $('savedSettings');
        const history = await loadHistory();
        container.replaceChildren();
        if (!history.length) {
          const empty = document.createElement('p');
          empty.className = 'jbsui-saved-settings-empty';
          empty.textContent = '保存された設定はありません。';
          container.appendChild(empty);
          return;
        }
        history.slice(0, 100).forEach((snapshot, index) => {
          if (!snapshot?.fields) return;
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'jbsui-saved-setting';
          const details = settingsNamingDetails(snapshot.fields);
          item.textContent = window.JBSNaming?.formatSavedLabel
            ? JBSNaming.formatSavedLabel({ savedAt: snapshot.savedAt, ...details })
            : (snapshot.filename || filenameFor(snapshot.fields));
          item.title = item.textContent;
          item.addEventListener('click', () => {
            restoreHistory(index).catch(error => console.error('保存した設定を読み込めませんでした。', error));
          });
          container.appendChild(item);
        });
      }
      async function saveCurrentSettings() {
        const fields = Object.fromEntries(SAVED_FIELDS.map(id => [id, $(id).value]));
        const history = [{ fields, files: { ...savedFiles }, savedAt: new Date().toISOString() }, ...await loadHistory()].slice(0, 100);

        // Save the full snapshot, including File objects, to IndexedDB when available.
        let indexedDbSaved = false;
        try {
          await savedSnapshot('save', history, 'history');
          indexedDbSaved = true;
        } catch (error) {
          console.warn('IndexedDBへ設定を保存できませんでした。localStorageへ保存します。', error);
        }

        // Always keep a metadata-only fallback so settings remain usable even
        // when IndexedDB is unavailable. File objects are intentionally omitted.
        const fallbackHistory = history.map(snapshot => ({
          fields: snapshot.fields,
          files: { left: null, right: null, bg: null },
          savedAt: snapshot.savedAt
        }));
        localStorage.setItem(SETTINGS_HISTORY_KEY, JSON.stringify(fallbackHistory));
        return indexedDbSaved || fallbackHistory.length > 0;
      }
      async function restoreHistory(index) {
        const snapshot = (await loadHistory())[index];
        if (!snapshot?.fields) return;
        for (const id of SAVED_FIELDS) {
          if (typeof snapshot.fields[id] === 'string') $(id).value = snapshot.fields[id];
        }
        if (snapshot.fields.seriesSubtitle && !$('series').value.endsWith(snapshot.fields.seriesSubtitle)) {
          $('series').value += snapshot.fields.seriesSubtitle;
        }
        lastTournamentKey = tournamentKey(findTournamentForCurrentFields()) || $('series').value.trim();
        for (const side of ['left', 'right']) {
          const player = players.find(p => p.id === $(`${side}Player`).value)
            || players.find(p => p.name === $(`${side}Name`).value.trim());
          savedFiles[side] = snapshot.files?.[side] || null;
          state[`${side}Override`] = !!savedFiles[side];
          const src = savedFiles[side] ? URL.createObjectURL(savedFiles[side]) : player?.photo;
          try { state[`${side}Image`] = src ? await loadImage(src) : null; }
          catch { state[`${side}Image`] = null; }
          if (savedFiles[side]) {
            syncPlayerPhotoPreviewFromFile(side, savedFiles[side]);
            URL.revokeObjectURL(src);
          } else {
            syncPlayerPhotoPreview(side, player?.photo);
          }
          $(`${side}Player`).value = '';
        }
        savedFiles.bg = snapshot.files?.bg || null;
        const bgSrc = savedFiles.bg && URL.createObjectURL(savedFiles.bg);
        try { state.bgImage = bgSrc ? await loadImage(bgSrc) : null; }
        catch { state.bgImage = null; }
        if (bgSrc) URL.revokeObjectURL(bgSrc);
        $('bgPhotoStatus').textContent = savedFiles.bg?.name || '';
        render();
        $('settingsDialog')?.close();
      }

      function hexToRgb(hex) {
        const v = hex.replace('#', '');
        return {
          r: parseInt(v.slice(0,2), 16),
          g: parseInt(v.slice(2,4), 16),
          b: parseInt(v.slice(4,6), 16)
        };
      }
      function alpha(hex, a) {
        const {r,g,b} = hexToRgb(hex);
        return `rgba(${r},${g},${b},${a})`;
      }
      function luminance(r, g, b) {
        const channel = value => {
          const c = value / 255;
          return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
      }
      function fallbackContrastText(hex) {
        const {r, g, b} = hexToRgb(hex);
        return luminance(r, g, b) > 0.179 ? '#000000' : '#ffffff';
      }
      function contrastText(hex) {
        if (commonBrandReady && window.JBSBrand?.getTextColor) {
          return window.JBSBrand.getTextColor(hex, fallbackContrastText(hex)) || fallbackContrastText(hex);
        }
        return fallbackContrastText(hex);
      }
      function mix(hex, amount = 0.2) {
        const {r,g,b} = hexToRgb(hex);
        const t = amount >= 0 ? 255 : 0;
        const p = Math.abs(amount);
        const c = (x) => Math.round(x + (t - x) * p);
        const toHex = (x) => c(x).toString(16).padStart(2, '0');
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }
      function makeSubColor(mainColor) {
        if (commonBrandReady && window.JBSBrand?.makeSubColor) {
          return window.JBSBrand.makeSubColor(mainColor) || mix(mainColor, 0.32);
        }
        return mix(mainColor, 0.32);
      }
      function syncSubColor() {
        $('subColor').value = makeSubColor($('mainColor').value);
      }
      function normalizeHex(value) {
        const hex = value.trim().replace(/^#/, '');
        if (/^[0-9a-f]{3}$/i.test(hex)) return `#${[...hex].map(c => c + c).join('').toUpperCase()}`;
        if (/^[0-9a-f]{6}$/i.test(hex)) return `#${hex.toUpperCase()}`;
        return null;
      }
      async function loadCommonBrand() {
        if (!window.JBSBrand?.load) {
          console.warn('[JBS Thumbnail] common/brand.js を読み込めないため内蔵マスタを使用します。');
          return;
        }
        try {
          await window.JBSBrand.load();
          const source = window.JBSBrand.getTournaments();
          if (!Array.isArray(source) || !source.length) throw new Error('大会マスタが空です。');
          tournaments = source;
          commonBrandReady = true;
          console.info(`[JBS Thumbnail] common の大会マスタ ${source.length}件を読み込みました。`);
        } catch (error) {
          commonBrandReady = false;
          tournaments = FALLBACK_TOURNAMENTS.map(entry => ({ ...entry }));
          console.warn('[JBS Thumbnail] common の取得に失敗したため内蔵マスタを使用します。', error);
        }
      }
      function tournamentKey(master) {
        return master ? (master.id || master.name || '') : '';
      }
      function findTournament(query) {
        const key = String(query || '').trim().toLocaleLowerCase();
        if (!key) return null;
        return tournaments.find(entry => [entry.id, entry.name, entry.nameEn]
          .filter(Boolean)
          .some(value => String(value).trim().toLocaleLowerCase() === key)) || null;
      }
      function findTournamentForCurrentFields() {
        const series = $('series').value.trim();
        return findTournament(series)
          || findTournament(`${series}オープン`);
      }
      function syncSupplementFromSelections({ force = false } = {}) {
        const master = findTournamentForCurrentFields();
        const stage = $('stage').value.trim();
        const stageEn = STAGE_ENGLISH[stage];
        const current = $('supplement').value.trim();
        const canReplace = force || !current || current === lastAutoSupplement;

        if (!master?.nameEn || !stageEn) {
          if (canReplace && current === lastAutoSupplement) {
            $('supplement').value = '';
            lastAutoSupplement = '';
          }
          return;
        }
        if (!canReplace) return;

        const value = `JBS ${master.nameEn} ${stageEn}`.replace(/\s+/g, ' ').trim();
        $('supplement').value = value;
        lastAutoSupplement = value;
      }
      function applyTournamentMaster(master, { force = false } = {}) {
        const key = tournamentKey(master) || $('series').value.trim();
        if (!force && key === lastTournamentKey) {
          render();
          return;
        }
        lastTournamentKey = key;
        if (master) {
          $('series').value = master.name;
          if (master.color) $('mainColor').value = master.color;
          $('subColor').value = master.subColor || makeSubColor(master.color || $('mainColor').value);
          if (master.edition) $('edition').value = master.edition;
        }
        syncSupplementFromSelections();
        render();
      }
      let lastTournamentKey = null;
      function applySeriesMaster() {
        const master = findTournamentForCurrentFields();
        applyTournamentMaster(master);
      }
      function roundedRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();

        na:'な', ni:'に', nu:'ぬ', ne:'ね', no:'の',
        ha:'は', hi:'ひ', fu:'ふ', he:'へ', ho:'ほ',
        ba:'ば', bi:'び', bu:'ぶ', be:'べ', bo:'ぼ',
        pa:'ぱ', pi:'ぴ', pu:'ぷ', pe:'ぺ', po:'ぽ',
        ma:'ま', mi:'み', mu:'む', me:'め', mo:'も',
        ya:'や', yu:'ゆ', yo:'よ',
        ra:'ら', ri:'り', ru:'る', re:'れ', ro:'ろ',
        wa:'わ', wi:'ゐ', we:'ゑ', wo:'を',
        n:'ん'
      }));
      function normalizeRomaji(value) {
        return String(value || '')
          .normalize('NFKD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[’']/g, "'")
          .replace(/[^A-Za-z'-]/g, '')
          .toLowerCase();
      }
      function romajiToHiragana(value) {
        let source = normalizeRomaji(value);
        if (!source) return '';
        source = source
          .replace(/ō/g, 'o')
          .replace(/ū/g, 'u')
          .replace(/ā/g, 'a')
          .replace(/ī/g, 'i')
          .replace(/ē/g, 'e');
        let result = '';
        let i = 0;
        while (i < source.length) {
          if (source[i] === '-' || source[i] === "'") { i += 1; continue; }
          if (i > 0 && source[i] === 'h' && source[i - 1] === 'o') { i += 1; continue; }
          if (
            i + 1 < source.length &&
            source[i] === source[i + 1] &&
            /[bcdfghjklmpqrstvwxyz]/.test(source[i]) &&
            source[i] !== 'n'
          ) {
            result += 'っ'; i += 1; continue;
          }
          if (source[i] === 'm' && i + 1 < source.length && /[bmp]/.test(source[i + 1])) {
            result += 'ん'; i += 1; continue;
          }
          if (
            source[i] === 'n' &&
            (i === source.length - 1 || source[i + 1] === "'" || !/[aiueoy]/.test(source[i + 1]))
          ) {
            result += 'ん'; i += 1;
            if (source[i] === "'") i += 1;
            continue;
          }
          let matched = false;
          for (const length of [3, 2, 1]) {
            const part = source.slice(i, i + length);
            const kana = ROMAJI_TO_HIRAGANA.get(part);
            if (kana) {
              result += kana;
              i += length;
              matched = true;
              break;
            }
          }
          if (!matched) return '';
        }
        return result;
      }
      function japaneseSurnameText(member) {
        return String(member.name || '').trim().split(/\s+/)[0] || '';
      }
      function inferJapaneseSurnameRomaji(member) {
        const tokens = String(member.roman || '')
          .trim()
          .split(/\s+/)
          .map(token => token.replace(/^[^A-Za-z]+|[^A-Za-z'-]+$/g, ''))
          .filter(Boolean);
        if (!tokens.length) return '';
        const uppercaseSurname = tokens.find(token =>
          /[A-Z]/.test(token) && token === token.toUpperCase() && /^[A-Z'-]+$/.test(token)
        );
        if (uppercaseSurname) return uppercaseSurname;
        const japaneseLikeTokens = tokens.filter(token => romajiToHiragana(token));
        if (japaneseLikeTokens.length) return japaneseLikeTokens[japaneseLikeTokens.length - 1];
        return tokens[0];
      }
      function japaneseSurnameSortKey(member) {
        const surnameJa = japaneseSurnameText(member);
        if (surnameJa && /^[\u3040-\u30ffー]+$/.test(surnameJa)) {
          return katakanaToHiragana(surnameJa);
        }
        const surnameRomaji = inferJapaneseSurnameRomaji(member);
        return romajiToHiragana(surnameRomaji) || surnameRomaji.toLocaleLowerCase('en');
      }
      function foreignFirstNameSortKey(member) {
        return String(member.name || '').trim().split(/\s+/)[0].toLocaleLowerCase('en');
      }
      function memberPhotoUrl(path) {
        if (!path) return '';
        const url = new URL(path, MEMBER_BASE_URL);
        url.searchParams.set('v', String(memberCacheKey));
        return url.href;
      }
      async function loadMemberPlayers() {
        try {
          memberCacheKey = Date.now();
          const url = new URL(MEMBER_DATA_URL);
          url.searchParams.set('v', String(memberCacheKey));
          const response = await fetch(url.href, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const source = Array.isArray(data) ? data : data?.members;
          if (!Array.isArray(source)) throw new Error('会員一覧の形式が正しくありません。');

          const jaCollator = new Intl.Collator('ja', { sensitivity: 'base', numeric: true });
          const enCollator = new Intl.Collator('en', { sensitivity: 'base', numeric: true });
          players = source
            .map((raw, index) => ({
              id: String(raw?.id || raw?.filename || `member-${index + 1}`),
              name: String(raw?.name ?? raw?.nameJa ?? '').trim(),
              roman: String(raw?.nameEn ?? '').trim(),
              photo: memberPhotoUrl(String(raw?.photo ?? '').trim())
            }))
            .filter(player => player.name && player.roman && player.photo)
            .sort((a, b) => {
              const aForeign = isForeignMember(a);
              const bForeign = isForeignMember(b);
              if (aForeign !== bForeign) return aForeign ? 1 : -1;
              if (!aForeign) {
                const bySurname = jaCollator.compare(japaneseSurnameSortKey(a), japaneseSurnameSortKey(b));
                if (bySurname !== 0) return bySurname;
                const byEnglish = enCollator.compare(a.roman, b.roman);
                if (byEnglish !== 0) return byEnglish;
                return jaCollator.compare(a.name, b.name);
              }
              const byFirstName = enCollator.compare(foreignFirstNameSortKey(a), foreignFirstNameSortKey(b));
              if (byFirstName !== 0) return byFirstName;
              return enCollator.compare(a.name, b.name);
            });
        } catch (error) {
          players = [];
          console.error('[JBS Thumbnail] member の選手一覧を取得できませんでした。', error);
        }
      }
      function populate() {
        const seriesPreset = $('seriesPreset');
        seriesPreset.replaceChildren(new Option('選択', ''));
        tournaments.forEach((master) => {
          seriesPreset.add(new Option(master.name, master.name));
        });
        for (const side of ['left', 'right']) {
          const select = $(side + 'Player');
          select.replaceChildren(new Option('選択', ''));
          players.forEach((player) => {
            const option = new Option(player.name, player.id);
            option.dataset.roman = player.roman || '';
            select.add(option);
          });
        }
      }
      function bind() {
        ['sponsor','edition','stagePrefix','bgMode','bgX','bgY','bgScale','bgShade','leftName','leftRoman','rightName','rightRoman']
          .forEach(id => $(id).addEventListener('input', render));
        $('supplement').addEventListener('input', () => {
          if ($('supplement').value.trim() !== lastAutoSupplement) lastAutoSupplement = '';
          render();
        });
        $('stage').addEventListener('input', () => { syncSupplementFromSelections(); render(); });
        $('stage').addEventListener('change', () => { syncSupplementFromSelections(); render(); });
        $('series').addEventListener('input', applySeriesMaster);
        $('series').addEventListener('change', applySeriesMaster);
        $('mainColor').addEventListener('input', () => { syncSubColor(); render(); });
        $('subColor').addEventListener('input', render);
        for (const id of ['mainColor', 'subColor']) {
          const code = $(`${id}Code`);
          code.addEventListener('input', () => {
            const hex = normalizeHex(code.value);
            if (!hex) return;
            $(id).value = hex;
            if (id === 'mainColor') syncSubColor();
            render();
          });
          code.addEventListener('blur', () => { code.value = $(id).value.toUpperCase(); });
        }
        $('bgMode').addEventListener('change', render);
        $('seriesPreset').addEventListener('change', () => {
          const select = $('seriesPreset');
          if (!select.value) return;
          const value = select.value;
          const master = findTournament(value);
          $('series').value = value;
          applyTournamentMaster(master, { force: true });
          select.value = '';
        });
        $('stagePreset').addEventListener('change', () => {
          const select = $('stagePreset');
          if (!select.value) return;
          $('stage').value = select.value;
          syncSupplementFromSelections();
          render();
          select.value = '';
        });

        for (const side of ['left', 'right']) {
          const select = $(side + 'Player');
          select.addEventListener('change', async () => {
            if (!select.value) return;
            const id = select.value;
            await applyPlayer(side, id, true);
            select.value = '';
          });
          $(`${side}PhotoButton`).addEventListener('click', () => $(`${side}PhotoOverride`).click());
          $(`${side}PhotoOverride`).addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            syncPlayerPhotoPreviewFromFile(side, file);
            loadFileImage(file, img => {
              state[`${side}Image`] = img;
              state[`${side}Override`] = true;
              savedFiles[side] = file;
            });
          });
        }
        $('bgPhoto').addEventListener('change', (e) => {
          $('bgPhotoStatus').textContent = e.target.files[0]?.name || '';
          loadFileImage(e.target.files[0], img => { state.bgImage = img; savedFiles.bg = e.target.files[0]; });
        });
        $('loadSettings').addEventListener('click', async () => {
          await renderSavedSettings();
          $('settingsDialog')?.showModal();
        });
        $('importJson').addEventListener('click', () => $('importJsonFile').click());
        $('importJsonFile').addEventListener('change', async (event) => {
          const input = event.currentTarget;
          await importJsonFile(input.files?.[0]);
          input.value = '';
        });
        $('saveSettings').addEventListener('click', async (event) => {
          const button = event.currentTarget;
          try {
            const saved = await saveCurrentSettings();
            if (!saved) throw new Error('設定を保存できませんでした。');
            showSaveFeedback(button);
          } catch (error) {
            console.error('設定保存に失敗しました。', error);
            alert('設定を保存できませんでした。ブラウザの保存設定を確認してください。');
          }
        });
        $('exportJson').addEventListener('click', downloadJson);
        $('closeSettings').addEventListener('click', () => $('settingsDialog')?.close());
        $('settingsDialog').addEventListener('click', event => {
          if (event.target === event.currentTarget) event.currentTarget.close();
        });

        $('downloadBtn').addEventListener('click', async () => {
          render();
          const fields = Object.fromEntries(SAVED_FIELDS.map(id => [id, $(id).value]));
          const filename = filenameFor(fields);
          canvas.toBlob((blob) => {
            if (!blob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          }, 'image/png');
        });
      }

      // Import the current overlay's values after this editor is fully ready.
      // Images travel through postMessage instead of oversized URL parameters.
      async function importOverlayPlayer(side, name, roman, rawPhoto) {
        const normalized = value => String(value || '').replace(/[\s\u3000]+/g, '');
        const player = players.find(item => normalized(item.name) === normalized(name));
        const playerSelect = $(side + 'Player');
        playerSelect.value = '';
        $(side + 'Name').value = name || '';
        $(side + 'Roman').value = roman || player?.roman || '';
        savedFiles[side] = null;
        state[side + 'Override'] = false;
        const photo = typeof rawPhoto === 'string'
          && /^(data:image\/|https:\/\/jbsbackgammon\.github\.io\/member\/)/i.test(rawPhoto)
          ? rawPhoto : (player?.photo || '');
        if (photo.startsWith('data:image/')) {
          try {
            const response = await fetch(photo);
            const blob = await response.blob();
            const extension = blob.type === 'image/png' ? 'png' : blob.type === 'image/jpeg' ? 'jpg' : 'webp';
            savedFiles[side] = new File([blob], 'overlay_' + side + '.' + extension, { type: blob.type || 'image/webp' });
            state[side + 'Override'] = true;
          } catch (error) {
            console.warn('選手写真の保存用変換に失敗しました。', error);
          }
        }
        syncPlayerPhotoPreview(side, photo);
        try { state[side + 'Image'] = photo ? await loadImage(photo) : null; }
        catch (error) {
          state[side + 'Image'] = null;
          syncPlayerPhotoPreview(side, '');
          console.warn('配信盤面の選手写真を読み込めませんでした。', error);
        }
        playerSelect.value = '';
      }

      async function applyOverlayTransfer(fields) {
        if (!fields || typeof fields !== 'object' || Array.isArray(fields)) return;
        const text = value => typeof value === 'string' ? value : '';
        const title = text(fields.series).trim();
        const master = findTournament(title);
        $('edition').value = text(fields.edition);
        $('series').value = title;
        $('stage').value = text(fields.stage);
        $('stagePrefix').value = '';
        $('sponsor').value = '';
        $('supplement').value = '';
        lastAutoSupplement = '';
        const color = normalizeHex(text(fields.mainColor)) || master?.color || $('mainColor').value;
        $('mainColor').value = color;
        $('subColor').value = normalizeHex(text(fields.subColor)) || makeSubColor(color);
        // Keep custom editions and theme colors instead of restoring presets.
        lastTournamentKey = tournamentKey(master) || $('series').value.trim();
        syncSupplementFromSelections({ force: true });
        await Promise.all([
          importOverlayPlayer('left', text(fields.leftName), text(fields.leftRoman), fields.leftPhoto),
          importOverlayPlayer('right', text(fields.rightName), text(fields.rightRoman), fields.rightPhoto)
        ]);
        render();
      }

      function enableOverlayTransfer() {
        const query = new URLSearchParams(location.search);
        const token = query.get('transfer');
        if (query.get('from') !== 'overlay' || !/^[A-Za-z0-9_-]{8,100}$/.test(token || '') || !window.opener) return;
        window.addEventListener('message', event => {
          if (event.origin !== location.origin || event.source !== window.opener
            || event.data?.type !== 'jbs-overlay-thumbnail-data' || event.data.token !== token) return;
          applyOverlayTransfer(event.data.fields).catch(error => {
            console.error('配信盤面の入力内容をサムネイルへ反映できませんでした。', error);
          });
        });
        window.opener.postMessage({ type: 'jbs-thumbnail-ready', token }, location.origin);
      }

      async function init() {
        // Start member loading in parallel, but do not block the initial
        // thumbnail preview on the member list.
        const memberPromise = loadMemberPlayers();

        // The first visible canvas paint waits only for the tournament master
        // and the actual Japanese canvas fonts.
        await Promise.all([loadCommonBrand(), ensureCanvasFonts()]);
        populate();
        bind();

        // Match overlay defaults. The edition is always sourced from common.
        $('series').value = '日本選手権';
        $('stage').value = '決勝';
        const initialTournament = findTournament('日本選手権');
        if (initialTournament) {
          applyTournamentMaster(initialTournament, { force: true });
          syncSupplementFromSelections({ force: true });
        } else {
          $('edition').value = '';
          syncSupplementFromSelections({ force: true });
        }

        // Explicitly paint the default tournament immediately so the preview
        // itself, not only the input fields, starts as 日本選手権・決勝.
        render();
        enableOverlayTransfer();

        // Populate player choices afterward without delaying the initial preview.
        await memberPromise;
        populate();
        render();

        // Repaint once if the browser reports a later font-set transition
        // (for example after a slow cache/network response).
        document.fonts?.ready?.then(() => render()).catch?.(() => {});
      }
      init();
    })();
  </script>
