<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>JBS YouTube Thumbnail Maker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #657089;
      --line: #dfe3eb;
      --panel: #ffffff;
      --bg: #f4f6f9;
      --accent: #6B0D2F;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans JP", "Yu Gothic", "YuGothic", "Hiragino Sans", "Meiryo", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input, select { font: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
    }
    .controls {
      padding: 24px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
      max-height: 100vh;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .group {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .group:first-of-type { border-top: 0; padding-top: 0; }
    .group-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #4b556b; margin-bottom: 5px; }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid #cfd5df;
      border-radius: 9px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }
    input[type="file"] { padding: 7px; font-size: 12px; }
    input[type="range"] { min-height: 28px; padding: 0; }
    .player-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fafbfc;
      margin-bottom: 10px;
    }
    .player-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .side-tag { font-size: 12px; font-weight: 800; letter-spacing: .05em; }
    .swap {
      border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 4px; }
    .preview-download {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 2;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .preview-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 24px;
      gap: 12px;
    }
    .preview-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .canvas-shell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    canvas {
      display: block;
      width: min(100%, calc((100vh - 100px) * 16 / 9));
      height: auto;
      max-height: calc(100vh - 100px);
      background: #fff;
      box-shadow: 0 12px 40px rgba(28, 39, 60, .16);
      border-radius: 4px;
    }
    .accent-chip { display:inline-flex; align-items:center; gap:7px; }
    .accent-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .hidden { display: none !important; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .controls { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .preview-wrap { padding: 14px; }
      canvas { width: 100%; max-height: none; }
      .preview-download { top: 14px; right: 14px; padding: 9px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="controls">
      <section class="group">
        <div class="group-title">大会情報</div>
        <div class="field">
          <label for="series">タイトル戦</label>
          <select id="series"></select>
        </div>
        <div class="row">
          <div class="field">
            <label for="edition">回数</label>
            <input id="edition" type="number" min="1" max="999" value="32" />
          </div>
          <div class="field">
            <label for="editionUnit">単位</label>
            <select id="editionUnit">
              <option value="期" selected>期</option>
              <option value="回">回</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="stage">試合名</label>
          <input id="stage" list="stageList" value="決勝" placeholder="例：決勝 / 準決勝 / 準々決勝" />
          <datalist id="stageList">
            <option value="決勝"></option>
            <option value="準決勝"></option>
            <option value="準々決勝"></option>
            <option value="本戦1回戦"></option>
            <option value="本戦2回戦"></option>
            <option value="本戦3回戦"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="supplement">補足情報</label>
          <input id="supplement" value="" placeholder="例：愛知県・愛三文化会館 / LIVE配信" />
        </div>
      </section>

      <section class="group">
        <div class="player-head">
          <div class="group-title" style="margin:0">選手</div>
          <button class="swap" id="swapPlayers" type="button">左右を入替</button>
        </div>

        <div class="player-card">
          <div class="side-tag">LEFT PLAYER</div>
          <div class="field">
            <label for="leftPlayer">選手マスター</label>
            <select id="leftPlayer"></select>
          </div>
          <div class="field">
            <label for="leftName">日本語名</label>
            <input id="leftName" />
          </div>
          <div class="field">
            <label for="leftRoman">ローマ字</label>
            <input id="leftRoman" />
          </div>
          <div class="field">
            <label for="leftPhotoOverride">写真を一時差替</label>
            <input id="leftPhotoOverride" type="file" accept="image/*" />
          </div>
        </div>

        <div class="player-card">
          <div class="side-tag">RIGHT PLAYER</div>
          <div class="field">
            <label for="rightPlayer">選手マスター</label>
            <select id="rightPlayer"></select>
          </div>
          <div class="field">
            <label for="rightName">日本語名</label>
            <input id="rightName" />
          </div>
          <div class="field">
            <label for="rightRoman">ローマ字</label>
            <input id="rightRoman" />
          </div>
          <div class="field">
            <label for="rightPhotoOverride">写真を一時差替</label>
            <input id="rightPhotoOverride" type="file" accept="image/*" />
          </div>
        </div>
      </section>

      <section class="group">
        <div class="group-title">背景</div>
        <div class="field">
          <label for="bgMode">背景モード</label>
          <select id="bgMode">
            <option value="standard">通常（選手写真2枚）</option>
            <option value="photo">全面写真（決勝向け）</option>
          </select>
        </div>
        <div id="photoControls" class="hidden">
          <div class="field">
            <label for="bgPhoto">全面背景写真</label>
            <input id="bgPhoto" type="file" accept="image/*" />
          </div>
          <div class="row">
            <div class="field">
              <label for="bgX">左右位置</label>
              <input id="bgX" type="range" min="0" max="100" value="50" />
            </div>
            <div class="field">
              <label for="bgY">上下位置</label>
              <input id="bgY" type="range" min="0" max="100" value="50" />
            </div>
          </div>
          <div class="field">
            <label for="bgShade">暗さ</label>
            <input id="bgShade" type="range" min="0" max="70" value="22" />
          </div>
          <div class="hint">背景写真は16:9に自動トリミングされます。人物位置に合わせて左右・上下を調整できます。</div>
        </div>
      </section>
    </aside>

    <main class="preview-wrap">
      <button class="preview-download" id="downloadBtn" type="button">PNG保存</button>
      <div class="canvas-shell">
        <canvas id="canvas" width="1920" height="1080" aria-label="サムネイルプレビュー"></canvas>
      </div>
    </main>
  </div>

  <script>
    // GitHub Pages / browser cache対策。リリースごとにAPP_BUILDを更新する。
    (() => {
      const APP_BUILD = '10';
      const url = new URL(window.location.href);
      if (url.searchParams.get('v') !== APP_BUILD) {
        url.searchParams.set('v', APP_BUILD);
        window.location.replace(url.toString());
      }
    })();
  </script>
  <script src="players.js?v=10"></script>
  <script>
    (() => {
      'use strict';

      const APP_BUILD = '10';
      console.info(`[JBS Thumbnail] build ${APP_BUILD}`);

      const SERIES = {
        '日本選手権': '#3C3C3C',
        '盤聖戦': '#6B0D2F',
        '名人戦': '#6B670D',
        '王位戦': '#0D6B2F',
        '賽王戦': '#0D236B',
        '棋聖戦': '#6B230D',
        '女王戦': '#6B0D5B',
        '新鋭戦': '#0D676B'
      };

      const players = Array.isArray(window.JBS_PLAYERS) ? window.JBS_PLAYERS : [];
      const $ = (id) => document.getElementById(id);
      const canvas = $('canvas');
      const ctx = canvas.getContext('2d');
      const FONT_JP = '"Noto Sans JP", "Yu Gothic", "YuGothic", "Hiragino Sans", "Meiryo", sans-serif';
      const FONT_LATIN = 'Arial, Helvetica, sans-serif';

      const state = {
        leftImage: null,
        rightImage: null,
        bgImage: null,
        leftOverride: false,
        rightOverride: false
      };

      function hexToRgb(hex) {
        const v = hex.replace('#', '');
        return {
          r: parseInt(v.slice(0,2), 16),
          g: parseInt(v.slice(2,4), 16),
          b: parseInt(v.slice(4,6), 16)
        };
      }
      function alpha(hex, a) {
        const {r,g,b} = hexToRgb(hex);
        return `rgba(${r},${g},${b},${a})`;
      }
      function mix(hex, amount = 0.2) {
        const {r,g,b} = hexToRgb(hex);
        const t = amount >= 0 ? 255 : 0;
        const p = Math.abs(amount);
        const c = (x) => Math.round(x + (t - x) * p);
        const toHex = (x) => c(x).toString(16).padStart(2, '0');
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }
      function roundedRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }
      function drawCover(img, x, y, w, h, posX = 50, posY = 50) {
        if (!img || !img.naturalWidth) return;
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const scale = Math.max(w / iw, h / ih);
        const sw = w / scale, sh = h / scale;
        const sx = Math.max(0, Math.min(iw - sw, (iw - sw) * (posX / 100)));
        const sy = Math.max(0, Math.min(ih - sh, (ih - sh) * (posY / 100)));
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      }
      function fitText(text, maxWidth, startSize, minSize, family = FONT_JP, weight = 800) {
        let size = startSize;
        while (size > minSize) {
          ctx.font = `${weight} ${size}px ${family}`;
          if (ctx.measureText(text).width <= maxWidth) break;
          size -= 2;
        }
        return size;
      }
      function drawTextFit(text, x, y, maxWidth, startSize, minSize, color, align = 'center', family = FONT_JP, weight = 800) {
        const size = fitText(text, maxWidth, startSize, minSize, family, weight);
        ctx.font = `${weight} ${size}px ${family}`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y);
        return size;
      }
      function drawImpactTextFit(text, x, y, maxWidth, startSize, minSize, fill, stroke, shadowColor, shadowBlur, shadowY, align = 'center', family = FONT_JP, weight = 900, strokeWidth = 0) {
        const size = fitText(text, maxWidth, startSize, minSize, family, weight);
        ctx.save();
        ctx.font = `${weight} ${size}px ${family}`;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        if (shadowBlur) {
          ctx.shadowColor = shadowColor;
          ctx.shadowBlur = shadowBlur;
          ctx.shadowOffsetY = shadowY || 0;
        }
        if (strokeWidth > 0) {
          ctx.lineJoin = 'round';
          ctx.miterLimit = 2;
          ctx.lineWidth = strokeWidth;
          ctx.strokeStyle = stroke;
          ctx.strokeText(text, x, y);
        }
        ctx.fillStyle = fill;
        ctx.fillText(text, x, y);
        ctx.restore();
        return size;
      }
      function drawBackgroundPattern(accent) {
        const grad = ctx.createLinearGradient(0, 0, 1920, 1080);
        grad.addColorStop(0, mix(accent, -0.18));
        grad.addColorStop(0.55, accent);
        grad.addColorStop(1, mix(accent, -0.06));
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1920, 1080);

        ctx.save();
        ctx.globalAlpha = 0.9;
        const stripeW = 278;
        for (let i = -2; i < 7; i++) {
          const x = i * stripeW;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + stripeW, 0);
          ctx.lineTo(x + stripeW - 180, 1080);
          ctx.lineTo(x - 180, 1080);
          ctx.closePath();
          ctx.fillStyle = i % 2 === 0 ? alpha('#ffffff', 0.06) : alpha('#000000', 0.06);
          ctx.fill();
        }

        ctx.globalAlpha = 0.88;
        const pointTop = -40;
        const pointBottom = 362;
        const pointW = 150;
        const gap = 7;
        for (let i = 0; i < 6; i++) {
          const x = 36 + i * (pointW + gap);
          ctx.beginPath();
          ctx.moveTo(x, pointTop);
          ctx.lineTo(x + pointW, pointTop);
          ctx.lineTo(x + pointW / 2, pointBottom);
          ctx.closePath();
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }
        for (let i = 0; i < 6; i++) {
          const x = 1036 + i * (pointW + gap);
          ctx.beginPath();
          ctx.moveTo(x, 1080 - pointTop);
          ctx.lineTo(x + pointW, 1080 - pointTop);
          ctx.lineTo(x + pointW / 2, 1080 - pointBottom);
          ctx.closePath();
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }

        ctx.lineWidth = 6;
        ctx.strokeStyle = alpha('#ffffff', 0.95);
        ctx.beginPath();
        ctx.arc(960, 352, 344, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 12;
        ctx.strokeStyle = alpha('#ffffff', 0.85);
        ctx.beginPath();
        ctx.arc(960, 352, 374, 0, Math.PI * 2);
        ctx.stroke();

        const checkerPositions = [
          [110, 805, 64], [155, 850, 64],
          [1608, 102, 56], [1732, 168, 56], [1636, 290, 56], [1756, 356, 56]
        ];
        checkerPositions.forEach(([x, y, r], idx) => {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = idx < 2 ? 8 : 0;
          if (idx < 2) {
            ctx.strokeStyle = accent;
            ctx.stroke();
          }
        });

        function die(x, y, size, pips) {
          roundedRect(x, y, size, size, 18);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.fillStyle = accent;
          const dotR = size * 0.08;
          const pos = {
            c: [x + size/2, y + size/2],
            tl: [x + size*0.25, y + size*0.25],
            tr: [x + size*0.75, y + size*0.25],
            ml: [x + size*0.25, y + size*0.5],
            mr: [x + size*0.75, y + size*0.5],
            bl: [x + size*0.25, y + size*0.75],
            br: [x + size*0.75, y + size*0.75],
          };
          const map = {
            1: ['c'],
            2: ['tl','br'],
            3: ['tl','c','br'],
            4: ['tl','tr','bl','br'],
            5: ['tl','tr','c','bl','br'],
            6: ['tl','tr','ml','mr','bl','br']
          };
          (map[pips] || []).forEach(key => {
            ctx.beginPath();
            ctx.arc(pos[key][0], pos[key][1], dotR, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        die(1518, 36, 120, 4);
        die(1668, 202, 120, 5);

        ctx.restore();

        const v = ctx.createLinearGradient(0, 0, 0, 1080);
        v.addColorStop(0, 'rgba(0,0,0,0.08)');
        v.addColorStop(0.46, 'rgba(0,0,0,0.00)');
        v.addColorStop(1, 'rgba(0,0,0,0.24)');
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, 1920, 1080);
      }
      function drawPortraitFrame(img, x, y, size, accent, side = 'left') {
        const pad = 10;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.22)';
        ctx.shadowBlur = 26;
        ctx.shadowOffsetY = 10;
        ctx.fillStyle = alpha('#000000', 0.18);
        roundedRect(x - 14, y - 14, size + 28, size + 28, 12);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#fff';
        roundedRect(x - 10, y - 10, size + 20, size + 20, 8);
        ctx.fill();
        ctx.fillStyle = accent;
        roundedRect(x - pad, y - pad, size + pad * 2, size + pad * 2, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y, size, size);
        if (img && img.naturalWidth) {
          drawCover(img, x, y, size, size, 50, 50);
        } else {
          ctx.fillStyle = '#e8ebef';
          ctx.fillRect(x, y, size, size);
          ctx.fillStyle = '#8892a0';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `700 34px ${FONT_JP}`;
          ctx.fillText('PHOTO', x + size/2, y + size/2);
        }
        const edgeX = side === 'left' ? x + size + 10 : x - 10;
        ctx.fillStyle = alpha('#ffffff', 0.94);
        ctx.beginPath();
        if (side === 'left') {
          ctx.moveTo(edgeX, y + 42);
          ctx.lineTo(edgeX + 26, y + 72);
          ctx.lineTo(edgeX, y + 102);
        } else {
          ctx.moveTo(edgeX, y + 42);
          ctx.lineTo(edgeX - 26, y + 72);
          ctx.lineTo(edgeX, y + 102);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      function drawCenterTitle(accent, isPhotoMode) {
        const series = $('series').value;
        const edition = $('edition').value || '';
        const unit = $('editionUnit').value;
        const stage = $('stage').value.trim() || '決勝';
        const editionText = `JBS 第${edition}${unit}`;
        const titleYBase = isPhotoMode ? 152 : 158;
        const titleColor = '#ffffff';
        const shadow = 'rgba(0,0,0,0.35)';

        if (isPhotoMode) {
          const panelGrad = ctx.createLinearGradient(0, 90, 0, 660);
          panelGrad.addColorStop(0, 'rgba(255,255,255,0.90)');
          panelGrad.addColorStop(1, 'rgba(255,255,255,0.76)');
          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,.30)';
          ctx.shadowBlur = 34;
          ctx.shadowOffsetY = 10;
          roundedRect(455, 62, 1010, 618, 4);
          ctx.fillStyle = panelGrad;
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.lineWidth = 6;
          ctx.strokeStyle = alpha(accent, 0.82);
          ctx.beginPath();
          ctx.arc(960, 374, 342, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          drawImpactTextFit(editionText, 960, titleYBase, 860, 84, 54, accent, 'transparent', 'rgba(255,255,255,0)', 0, 0, 'center', FONT_JP, 900, 0);
          drawImpactTextFit(series, 960, 310, 920, 196, 100, accent, alpha('#ffffff', 0.80), 'rgba(0,0,0,0.18)', 22, 8, 'center', FONT_JP, 900, 5);

          ctx.save();
          ctx.strokeStyle = accent;
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(628, 455);
          ctx.lineTo(1292, 455);
          ctx.stroke();
          ctx.restore();

          ctx.fillStyle = accent;
          roundedRect(642, 484, 636, 94, 2);
          ctx.fill();
          drawImpactTextFit('バックギャモン', 960, 531, 560, 58, 36, '#fff', 'transparent', 'rgba(0,0,0,0.12)', 10, 3, 'center', FONT_JP, 900, 0);
          drawImpactTextFit(stage, 960, 612, 700, 130, 68, mix(accent, -0.08), 'transparent', 'rgba(255,255,255,0.22)', 12, 0, 'center', FONT_JP, 900, 0);
        } else {
          const panelGrad = ctx.createLinearGradient(0, 90, 0, 690);
          panelGrad.addColorStop(0, 'rgba(255,255,255,0.10)');
          panelGrad.addColorStop(1, 'rgba(255,255,255,0.03)');
          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,.26)';
          ctx.shadowBlur = 34;
          ctx.shadowOffsetY = 10;
          ctx.beginPath();
          ctx.arc(960, 354, 374, 0, Math.PI * 2);
          ctx.fillStyle = panelGrad;
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.lineWidth = 8;
          ctx.strokeStyle = alpha('#ffffff', 0.95);
          ctx.beginPath();
          ctx.arc(960, 354, 356, 0, Math.PI * 2);
          ctx.stroke();
          ctx.lineWidth = 4;
          ctx.strokeStyle = alpha('#ffffff', 0.82);
          ctx.beginPath();
          ctx.arc(960, 354, 336, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          drawImpactTextFit(editionText, 960, titleYBase, 820, 104, 64, titleColor, accent, shadow, 30, 10, 'center', FONT_JP, 900, 6);
          drawImpactTextFit(series, 960, 330, 760, 236, 126, titleColor, accent, shadow, 40, 13, 'center', FONT_JP, 900, 9);

          ctx.save();
          ctx.strokeStyle = alpha('#ffffff', 0.96);
          ctx.lineWidth = 7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(648, 486);
          ctx.lineTo(1272, 486);
          ctx.stroke();
          ctx.restore();

          drawImpactTextFit('バックギャモン', 960, 552, 620, 104, 54, titleColor, accent, shadow, 28, 10, 'center', FONT_JP, 900, 7);
          drawImpactTextFit(stage, 960, 614, 760, 132, 72, titleColor, accent, shadow, 30, 10, 'center', FONT_JP, 900, 8);
        }
      }
      function drawNameBands(accent, isPhotoMode) {
        const leftName = $('leftName').value.trim() || '選手名';
        const rightName = $('rightName').value.trim() || '選手名';
        const leftRoman = $('leftRoman').value.trim() || 'PLAYER NAME';
        const rightRoman = $('rightRoman').value.trim() || 'PLAYER NAME';
        const supplement = $('supplement').value.trim();

        // 当初のサムネイルに近い「下帯」構成。
        // 上段：日本語名を大きく、下段：ローマ字名。中央にVSを独立配置。
        const bandY = 736;
        const jpH = 188;
        const romanH = 88;
        const footerY = bandY + jpH + romanH;

        // 上段の濃色帯
        const topGrad = ctx.createLinearGradient(0, bandY, 0, bandY + jpH);
        topGrad.addColorStop(0, alpha(mix(accent, 0.05), isPhotoMode ? 0.97 : 0.99));
        topGrad.addColorStop(1, alpha(mix(accent, -0.14), 1));
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, bandY, 1920, jpH);

        // 上端の細いハイライト
        ctx.fillStyle = alpha('#ffffff', 0.72);
        ctx.fillRect(0, bandY, 1920, 4);

        // 斜めの薄いパターンで単調さを防ぐ
        ctx.save();
        ctx.globalAlpha = 0.13;
        for (let x = -160; x < 2080; x += 230) {
          ctx.beginPath();
          ctx.moveTo(x, bandY);
          ctx.lineTo(x + 120, bandY);
          ctx.lineTo(x + 30, bandY + jpH);
          ctx.lineTo(x - 90, bandY + jpH);
          ctx.closePath();
          ctx.fillStyle = '#000';
          ctx.fill();
        }
        ctx.restore();

        // 左右の名前を必ず別領域にクリップして中央と干渉させない
        const sideMargin = 28;
        const vsGap = 150;
        const leftX = sideMargin;
        const leftW = 960 - vsGap - sideMargin;
        const rightX = 960 + vsGap;
        const rightW = 1920 - rightX - sideMargin;
        const jpY = bandY + 95;

        ctx.save();
        ctx.beginPath();
        ctx.rect(leftX, bandY + 10, leftW, jpH - 20);
        ctx.clip();
        drawImpactTextFit(
          leftName,
          leftX + leftW / 2,
          jpY,
          leftW - 28,
          132,
          62,
          '#ffffff',
          alpha('#000000', 0.20),
          'rgba(0,0,0,0.30)',
          24,
          8,
          'center',
          FONT_JP,
          900,
          2
        );
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(rightX, bandY + 10, rightW, jpH - 20);
        ctx.clip();
        drawImpactTextFit(
          rightName,
          rightX + rightW / 2,
          jpY,
          rightW - 28,
          132,
          62,
          '#ffffff',
          alpha('#000000', 0.20),
          'rgba(0,0,0,0.30)',
          24,
          8,
          'center',
          FONT_JP,
          900,
          2
        );
        ctx.restore();

        // VS：名前帯から独立した白い円
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.28)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 6;
        ctx.beginPath();
        ctx.arc(960, jpY, 71, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.lineWidth = 8;
        ctx.strokeStyle = accent;
        ctx.stroke();
        ctx.font = `900 58px ${FONT_LATIN}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = accent;
        ctx.fillText('VS', 960, jpY + 2);
        ctx.restore();

        // 下段：ローマ字用の少し明るい帯
        const romanY = bandY + jpH;
        const lowerGrad = ctx.createLinearGradient(0, romanY, 0, romanY + romanH);
        lowerGrad.addColorStop(0, alpha(mix(accent, 0.16), 1));
        lowerGrad.addColorStop(1, alpha(mix(accent, 0.08), 1));
        ctx.fillStyle = lowerGrad;
        ctx.fillRect(0, romanY, 1920, romanH);
        ctx.fillStyle = alpha('#ffffff', 0.16);
        ctx.fillRect(0, romanY, 1920, 2);

        ctx.save();
        ctx.beginPath();
        ctx.rect(leftX, romanY, leftW, romanH);
        ctx.clip();
        drawImpactTextFit(
          leftRoman,
          leftX + leftW / 2,
          romanY + romanH / 2 + 1,
          leftW - 24,
          58,
          28,
          '#ffffff',
          'transparent',
          'rgba(0,0,0,0.18)',
          12,
          3,
          'center',
          FONT_LATIN,
          800,
          0
        );
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(rightX, romanY, rightW, romanH);
        ctx.clip();
        drawImpactTextFit(
          rightRoman,
          rightX + rightW / 2,
          romanY + romanH / 2 + 1,
          rightW - 24,
          58,
          28,
          '#ffffff',
          'transparent',
          'rgba(0,0,0,0.18)',
          12,
          3,
          'center',
          FONT_LATIN,
          800,
          0
        );
        ctx.restore();

        // 補足情報は最下部の白帯に独立表示
        ctx.fillStyle = 'rgba(255,255,255,0.97)';
        ctx.fillRect(0, footerY, 1920, 1080 - footerY);
        if (supplement) {
          drawImpactTextFit(
            supplement,
            960,
            footerY + (1080 - footerY) / 2,
            1760,
            48,
            28,
            accent,
            'transparent',
            'rgba(255,255,255,0.18)',
            8,
            0,
            'center',
            FONT_JP,
            900,
            0
          );
        } else {
          const fallback = `${$('series').value} ${$('stage').value.trim()}`;
          drawTextFit(
            fallback,
            960,
            footerY + (1080 - footerY) / 2,
            1740,
            42,
            26,
            alpha(accent, .82),
            'center',
            FONT_JP,
            800
          );
        }
      }

      function render() {
        const accent = SERIES[$('series').value] || '#6B0D2F';
        const photoMode = $('bgMode').value === 'photo';
        document.documentElement.style.setProperty('--accent', accent);
        $('photoControls').classList.toggle('hidden', !photoMode);

        ctx.clearRect(0, 0, 1920, 1080);
        if (photoMode && state.bgImage && state.bgImage.naturalWidth) {
          drawCover(state.bgImage, 0, 0, 1920, 1080, Number($('bgX').value), Number($('bgY').value));
          const shade = Number($('bgShade').value) / 100;
          const overlay = ctx.createLinearGradient(0, 0, 0, 1080);
          overlay.addColorStop(0, `rgba(0,0,0,${shade * 0.82})`);
          overlay.addColorStop(0.58, `rgba(0,0,0,${shade * 0.48})`);
          overlay.addColorStop(1, `rgba(0,0,0,${Math.min(0.9, shade + 0.18)})`);
          ctx.fillStyle = overlay;
          ctx.fillRect(0, 0, 1920, 1080);
        } else {
          drawBackgroundPattern(accent);
          if (!photoMode) {
            drawPortraitFrame(state.leftImage, 56, 162, 504, accent, 'left');
            drawPortraitFrame(state.rightImage, 1360, 162, 504, accent, 'right');
          } else {
            drawBackgroundPattern(accent);
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.fillRect(0, 0, 1920, 1080);
            ctx.fillStyle = '#ffffff';
            ctx.font = `800 54px ${FONT_JP}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('全面背景写真を選択してください', 960, 710);
          }
        }

        drawCenterTitle(accent, photoMode);
        drawNameBands(accent, photoMode);
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }
      async function applyPlayer(side, playerId, forcePhoto = true) {
        const p = players.find(x => x.id === playerId) || players[0];
        if (!p) return;
        $(`${side}Name`).value = p.name || '';
        $(`${side}Roman`).value = p.roman || '';
        if (forcePhoto) {
          try {
            const img = await loadImage(p.photo);
            state[`${side}Image`] = img;
            state[`${side}Override`] = false;
          } catch (e) {
            state[`${side}Image`] = null;
          }
        }
        render();
      }
      function loadFileImage(file, cb) {
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { cb(img); URL.revokeObjectURL(url); render(); };
        img.src = url;
      }
      function populate() {
        Object.entries(SERIES).forEach(([name, color]) => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = `${name}  ${color}`;
          if (name === '盤聖戦') opt.selected = true;
          $('series').appendChild(opt);
        });
        ['leftPlayer','rightPlayer'].forEach((id) => {
          players.forEach((p) => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `${p.name} / ${p.roman}`;
            $(id).appendChild(opt);
          });
        });
        if (players[0]) $('leftPlayer').value = players[0].id;
        if (players[1]) $('rightPlayer').value = players[1].id;
        else if (players[0]) $('rightPlayer').value = players[0].id;
      }
      function bind() {
        ['series','edition','editionUnit','stage','supplement','bgMode','bgX','bgY','bgShade','leftName','leftRoman','rightName','rightRoman']
          .forEach(id => $(id).addEventListener('input', render));
        $('series').addEventListener('change', render);
        $('bgMode').addEventListener('change', render);

        $('leftPlayer').addEventListener('change', () => applyPlayer('left', $('leftPlayer').value, true));
        $('rightPlayer').addEventListener('change', () => applyPlayer('right', $('rightPlayer').value, true));
        $('leftPhotoOverride').addEventListener('change', (e) => loadFileImage(e.target.files[0], img => { state.leftImage = img; state.leftOverride = true; }));
        $('rightPhotoOverride').addEventListener('change', (e) => loadFileImage(e.target.files[0], img => { state.rightImage = img; state.rightOverride = true; }));
        $('bgPhoto').addEventListener('change', (e) => loadFileImage(e.target.files[0], img => { state.bgImage = img; }));

        $('swapPlayers').addEventListener('click', async () => {
          const lp = $('leftPlayer').value, rp = $('rightPlayer').value;
          const ln = $('leftName').value, rn = $('rightName').value;
          const lr = $('leftRoman').value, rr = $('rightRoman').value;
          const li = state.leftImage, ri = state.rightImage;
          $('leftPlayer').value = rp; $('rightPlayer').value = lp;
          $('leftName').value = rn; $('rightName').value = ln;
          $('leftRoman').value = rr; $('rightRoman').value = lr;
          state.leftImage = ri; state.rightImage = li;
          render();
        });

        $('downloadBtn').addEventListener('click', () => {
          render();
          const series = $('series').value;
          const stage = $('stage').value.trim() || 'match';
          const left = $('leftName').value.trim().replace(/\s+/g,'');
          const right = $('rightName').value.trim().replace(/\s+/g,'');
          const filename = `JBS_${series}_${stage}_${left}_vs_${right}_1920x1080.png`;
          canvas.toBlob((blob) => {
            if (!blob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          }, 'image/png');
        });
      }

      async function init() {
        populate();
        bind();
        await Promise.all([
          applyPlayer('left', $('leftPlayer').value, true),
          applyPlayer('right', $('rightPlayer').value, true)
        ]);
        render();
      }
      init();
    })();
  </script>
</body>
</html>
